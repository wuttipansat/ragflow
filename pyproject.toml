[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragflow"
version = "0.1.0"
description = "A modular RAG pipeline for documents"
requires-python = ">=3.10"

dependencies = [
    "pymupdf",
    "pyyaml",
    "python-dotenv",
    "pydantic-settings",
    "sentence-transformers",
    "numpy",
    "chromadb",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
